name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Validate site config
        run: node scripts/validate-config.mjs
      - name: Check cron schedule matches site config
        run: node scripts/check-cron.mjs
      - name: Run unit tests
        run: node --test
      - name: Rebuild manifest and confirm it is up to date
        run: |
          node scripts/build-manifest.mjs
          if ! git diff --exit-code digests.json; then
            echo "::error::digests.json is out of date. Run 'node scripts/build-manifest.mjs' and commit the result."
            exit 1
          fi
      - name: Lint changed digest files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t CHANGED_DIGESTS < <(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '^[0-9]{4}/.*\.html$' || true)
          if [ "${#CHANGED_DIGESTS[@]}" -eq 0 ]; then
            echo "No digest HTML files changed; skipping check-digest.mjs."
            exit 0
          fi
          printf '%s\n' "${CHANGED_DIGESTS[@]}"
          node scripts/check-digest.mjs "${CHANGED_DIGESTS[@]}"
